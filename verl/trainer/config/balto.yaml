# Shared paper BALTO settings for Megatron and FSDP.
algorithm:
  adv_estimator: grpo
  enable_balto: true
  hallucination_mask_key: hallucination_token_indices
  correct_token_mask_key: correct_token_indices
  use_kl_in_reward: false
  rollout_correction: null

actor_rollout_ref:
  actor:
    policy_loss:
      loss_mode: balto
    loss_agg_mode: seq-mean-token-mean
    use_kl_loss: false
    entropy_coeff: 0
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 1
    optim:
      lr: 1.0e-6
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
  rollout:
    n: 8
    log_prob_micro_batch_size_per_gpu: 1

data:
  train_batch_size: 256

critic:
  enable: false

reward_model:
  use_reward_loop: false
  reward_manager: batch

reward_manager:
  name: batch

custom_reward_function:
  # Supply the Judge reward implementation when launching training.
  path: null
  name: compute_score_batch

trainer:
  use_legacy_worker_impl: enable
  project_name: balto
  experiment_name: balto
